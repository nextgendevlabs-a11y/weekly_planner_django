<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weekly Planner{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f8fa;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: var(--accent-strong);
    }

    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .site-header__inner,
    main {
      width: min(100% - 2rem, 68rem);
      margin: 0 auto;
    }

    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4rem;
    }

    .brand {
      color: var(--text);
      font-size: 1.125rem;
      font-weight: 700;
      text-decoration: none;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .site-nav a,
    .site-nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      padding: 0;
      text-decoration: none;
    }

    .site-nav a:hover,
    .site-nav a:focus,
    .site-nav button:hover,
    .site-nav button:focus {
      color: var(--accent-strong);
    }

    main {
      padding: 3rem 0;
    }

    .messages {
      display: grid;
      gap: 0.75rem;
      margin: 0 0 2rem;
      padding: 0;
      list-style: none;
    }

    .messages li {
      border: 1px solid var(--border);
      border-left: 0.25rem solid var(--accent);
      background: var(--surface);
      padding: 0.75rem 1rem;
    }

    .intro {
      max-width: 45rem;
    }

    .intro h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 6vw, 3.75rem);
      line-height: 1.1;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .form-panel {
      max-width: 32rem;
    }

    .form-panel h1,
    .placeholder h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      line-height: 1.2;
    }

    .form-panel p,
    .placeholder p {
      color: var(--muted);
    }

    .form-fields {
      display: grid;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .form-fields.compact {
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .field {
      display: grid;
      gap: 0.4rem;
    }

    label {
      font-weight: 700;
    }

    input:not([type="checkbox"]),
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
      font: inherit;
    }

    textarea {
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
    }

    .checkbox-field {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .helptext {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .errorlist {
      margin: 0;
      padding-left: 1.25rem;
      color: var(--danger);
      font-weight: 600;
    }

    .button {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      display: inline-block;
      font: inherit;
      font-weight: 700;
      padding: 0.75rem 1rem;
      text-decoration: none;
    }

    .button:hover,
    .button:focus {
      background: var(--accent-strong);
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-strong);
    }

    .secondary-button:hover,
    .secondary-button:focus {
      border-color: var(--accent);
      background: #eefcf9;
    }

    .danger-button {
      margin-top: 0.75rem;
      background: var(--danger);
    }

    .danger-button:hover,
    .danger-button:focus {
      background: #912018;
    }

    .placeholder {
      max-width: 44rem;
    }

    .stack {
      display: grid;
      gap: 1.5rem;
    }

    .page-heading {
      max-width: 48rem;
    }

    .page-heading h1 {
      margin: 0 0 0.75rem;
      font-size: 2.25rem;
      line-height: 1.15;
    }

    .page-heading p,
    .empty-state,
    .status-note {
      color: var(--muted);
    }

    .project-list,
    .status-grid {
      display: grid;
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .project-list {
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
    }

    .project-list a,
    .status-section {
      display: block;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 1rem;
    }

    .project-list a {
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }

    .project-list a:hover,
    .project-list a:focus {
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    .status-grid {
      grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    }

    .status-section h2 {
      margin: 0 0 0.5rem;
      font-size: 1.125rem;
      line-height: 1.3;
    }

    .status-section p {
      margin: 0;
    }

    .status-section .section-action {
      margin-top: 1rem;
    }

    .submission-status-list {
      display: grid;
      gap: 0.75rem;
      margin: 1rem 0 0;
      padding: 0;
      list-style: none;
    }

    .submission-status-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    .submission-status-list span {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .submission-status-list strong {
      flex: 0 0 auto;
      color: var(--accent-strong);
    }

    .workflow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: 1rem;
      margin: 2.5rem 0 0;
      padding: 0;
      list-style: none;
    }

    .workflow li {
      min-height: 7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 1rem;
    }

    .workflow strong {
      display: block;
      margin-bottom: 0.35rem;
    }

    .workflow span {
      color: var(--muted);
    }

    .feedback-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
      gap: 1rem;
    }

    .section-heading h2 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .section-heading p {
      margin: 0;
    }

    .cluster-list {
      display: grid;
      gap: 1rem;
    }

    .cluster-panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 1rem;
    }

    .cluster-panel__header,
    .cluster-actions {
      display: grid;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .cluster-panel h3 {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.3;
    }

    .inline-form {
      display: grid;
      gap: 0.75rem;
      max-width: 34rem;
    }

    .compact-action {
      margin-top: 0.75rem;
    }

    .compact-stack {
      gap: 0.75rem;
      max-width: 34rem;
    }

    .suggestion-draft {
      display: grid;
      gap: 1rem;
      margin-top: 1rem;
    }

    .suggestion-card-controls {
      display: grid;
      gap: 0.75rem;
      margin: 0.5rem 0 0;
      padding: 0;
      list-style: none;
    }

    .suggestion-card-controls li {
      display: grid;
      gap: 0.4rem;
    }

    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      padding: 0.65rem 0.75rem;
      font: inherit;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin: 0;
      padding: 0.75rem;
    }

    legend {
      font-weight: 700;
      padding: 0 0.25rem;
    }

    fieldset ul {
      display: grid;
      gap: 0.35rem;
      margin: 0.5rem 0 0;
      padding: 0;
      list-style: none;
    }

    .feedback-section,
    .feedback-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 1rem;
    }

    .feedback-section {
      display: grid;
      align-content: start;
      gap: 1rem;
    }

    .feedback-section h2 {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    .feedback-card-list {
      display: grid;
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .feedback-card {
      background: #fbfcfd;
    }

    .feedback-card p {
      margin: 0 0 0.5rem;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{% url 'home' %}">Weekly Planner</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{% url 'home' %}">Home</a>
        {% if request.user.is_authenticated %}
          <a href="{% url 'projects' %}">Projects</a>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sign out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Sign in</a>
          <a href="{% url 'signup' %}">Create account</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main id="main-content">
    {% if messages %}
      <ul class="messages" role="status" aria-live="polite">
        {% for message in messages %}
          <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
