<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weekly Planner{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f8fa;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
      --accent: #0f766e;
      --accent-strong: #115e59;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: var(--accent-strong);
    }

    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .site-header__inner,
    main {
      width: min(100% - 2rem, 68rem);
      margin: 0 auto;
    }

    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4rem;
    }

    .brand {
      color: var(--text);
      font-size: 1.125rem;
      font-weight: 700;
      text-decoration: none;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .site-nav a {
      color: var(--muted);
      font-weight: 600;
      text-decoration: none;
    }

    .site-nav a:hover,
    .site-nav a:focus {
      color: var(--accent-strong);
    }

    main {
      padding: 3rem 0;
    }

    .messages {
      display: grid;
      gap: 0.75rem;
      margin: 0 0 2rem;
      padding: 0;
      list-style: none;
    }

    .messages li {
      border: 1px solid var(--border);
      border-left: 0.25rem solid var(--accent);
      background: var(--surface);
      padding: 0.75rem 1rem;
    }

    .intro {
      max-width: 45rem;
    }

    .intro h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 6vw, 3.75rem);
      line-height: 1.1;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .workflow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: 1rem;
      margin: 2.5rem 0 0;
      padding: 0;
      list-style: none;
    }

    .workflow li {
      min-height: 7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 1rem;
    }

    .workflow strong {
      display: block;
      margin-bottom: 0.35rem;
    }

    .workflow span {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{% url 'home' %}">Weekly Planner</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{% url 'home' %}">Home</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    {% if messages %}
      <ul class="messages" role="status" aria-live="polite">
        {% for message in messages %}
          <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
