[project]
name = "weekly-planner-django"
version = "0.1.0"
description = "Weekly team feedback and retrospective tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-django>=4.11,<5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "weekly_planner.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests"]
